<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Apple System Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="50%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0056B3"/>
    </linearGradient>

    <!-- Subtle Top Specular Glass Reflection -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Center Glyph -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002A5C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Apple iOS Squircle Base -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glass Highlight Layer -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#specular)"/>
  <rect x="1" y="1" width="510" height="510" rx="114" ry="114" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Apple iOS Voice & Broadcast Emblem -->
  <g filter="url(#glyphShadow)" fill="#FFFFFF">
    <!-- Bar 1 (Left Outer) -->
    <rect x="126" y="206" width="36" height="100" rx="18" ry="18" />
    <!-- Bar 2 (Left Mid) -->
    <rect x="182" y="156" width="36" height="200" rx="18" ry="18" />
    <!-- Bar 3 (Center High) -->
    <rect x="238" y="116" width="36" height="280" rx="18" ry="18" />
    <!-- Bar 4 (Right Mid) -->
    <rect x="294" y="156" width="36" height="200" rx="18" ry="18" />
    <!-- Bar 5 (Right Outer) -->
    <rect x="350" y="206" width="36" height="100" rx="18" ry="18" />
  </g>
</svg>
